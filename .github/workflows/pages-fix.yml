name: Set Pages source to gh-pages (one-time)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Point GitHub Pages at the prebuilt gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "== current Pages config =="
          curl -sH "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" | tee /tmp/pages_before.json
          echo
          echo "== attempt update (PUT) =="
          code=$(curl -s -o /tmp/pages_put.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "PUT status: $code"
          if [ "$code" = "404" ]; then
            echo "No Pages site yet — creating (POST)"
            code=$(curl -s -o /tmp/pages_post.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow","source":{"branch":"gh-pages","path":"/"}}')
            echo "POST status: $code"
          fi
          cat /tmp/pages_put.json /tmp/pages_post.json 2>/dev/null
          echo
          echo "== resulting Pages config =="
          curl -sH "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" | python3 -c "import json,sys; d=json.load(sys.stdin); print('build_type:', d.get('build_type')); print('source:', d.get('source')); print('status:', d.get('status')); print('url:', d.get('html_url'))"
